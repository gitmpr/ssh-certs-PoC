# Shared by every container in this chapter (kdc, web01, client) - copied
# in identically at build time so all three agree on the realm and where
# to find it. Real deployments distribute this via config management;
# baking it into the image is this repo's usual stand-in for that.
#
# rdns/dns_lookup_* are off on purpose: Docker's network here has no real
# reverse DNS, and Kerberos service principals are matched by hostname -
# see docs/gssapi.md for what that means in practice.

[libdefaults]
    default_realm = SSHCERTS.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    ticket_lifetime = 24h
    forwardable = true

[realms]
    SSHCERTS.LOCAL = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    .sshcerts.local = SSHCERTS.LOCAL
    sshcerts.local = SSHCERTS.LOCAL
